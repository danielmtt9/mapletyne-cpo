# Shared Security Headers for Mapletyne CPO Platform (GAP-SEC-11 & GAP-SEC-15)
# Included inside location blocks to guarantee preservation despite Nginx header inheritance rules

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://rsms.me; font-src 'self' https://fonts.gstatic.com https://rsms.me data:; connect-src 'self' ws: wss: https://*.trycloudflare.com https://*.mapletyne.com; img-src 'self' data: blob: https:;" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
