# Map WebSocket Upgrade headers
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Map incoming proxy forwarding headers (R1: Proxy-Agnostic & Tunnel-Ready Ingress)
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_x_forwarded_host $proxy_x_forwarded_host {
    default $http_x_forwarded_host;
    ''      $host;
}

map $http_x_forwarded_port $proxy_x_forwarded_port {
    default $http_x_forwarded_port;
    ''      $server_port;
}

# ── 1. Driver PWA App Subdomain (app.opencpo.mapletyne.com & *.app.opencpo.mapletyne.com) ──
server {
    listen 80;
    server_name app.opencpo.mapletyne.com *.app.opencpo.mapletyne.com app.mapletyne.com;

    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 100M;

    location / {
        set $cpo_chargeapp "http://mapletyne-chargeapp:8003";
        proxy_pass $cpo_chargeapp;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_x_forwarded_host;
        proxy_set_header X-Forwarded-Host $proxy_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_x_forwarded_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        include /etc/nginx/security-headers.conf;
    }
}

# ── 2. Core CSMS REST & WebSockets Subdomain (api.opencpo.mapletyne.com) ──
server {
    listen 80;
    server_name api.opencpo.mapletyne.com api.mapletyne.com;

    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 100M;

    # OCPP 1.6-J WebSocket (ws://api.opencpo.mapletyne.com/ocpp16/<cp_id>)
    location /ocpp16/ {
        set $cpo_ocpp16 "http://mapletyne-core:9100";
        rewrite ^/ocpp16/(.*)$ /$1 break;
        proxy_pass $cpo_ocpp16;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_x_forwarded_host;
        proxy_set_header X-Forwarded-Host $proxy_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_x_forwarded_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # OCPP 2.0.1 WebSocket (ws://api.opencpo.mapletyne.com/ocpp201/<cp_id>)
    location /ocpp201/ {
        set $cpo_ocpp201 "http://mapletyne-core:9201";
        rewrite ^/ocpp201/(.*)$ /$1 break;
        proxy_pass $cpo_ocpp201;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_x_forwarded_host;
        proxy_set_header X-Forwarded-Host $proxy_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_x_forwarded_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Roaming OCPI 2.2.1 Gateway (/ocpi/ & /ocpi/...)
    location /ocpi/ {
        set $cpo_core "http://mapletyne-core:8000";
        proxy_pass $cpo_core;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_x_forwarded_host;
        proxy_set_header X-Forwarded-Host $proxy_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_x_forwarded_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        include /etc/nginx/security-headers.conf;
    }

    # CSMS REST API & OpenAPI Docs
    location / {
        set $cpo_core "http://mapletyne-core:8000";
        proxy_pass $cpo_core;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_x_forwarded_host;
        proxy_set_header X-Forwarded-Host $proxy_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_x_forwarded_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        include /etc/nginx/security-headers.conf;
    }
}

