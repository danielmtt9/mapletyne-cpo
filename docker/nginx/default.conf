# ── 5. Primary Production Server & Single-Domain Path Gateway (opencpo.mapletyne.com) ──
server {
    listen 80 default_server;
    server_name opencpo.mapletyne.com admin.opencpo.mapletyne.com auth.opencpo.mapletyne.com admin.mapletyne.com localhost _;

    resolver 127.0.0.11 valid=30s ipv6=off;
    absolute_redirect off;
    client_max_body_size 100M;

    # Clean 301 redirects for path prefixes without trailing slash
    location = /cpo {
        return 301 /cpo/;
    }

    location = /app {
        return 301 /app/;
    }

    location = /farm {
        return 301 /farm/;
    }

    location = /tester {
        return 301 /tester/;
    }

    location = /auth {
        return 301 /auth/;
    }

    location = /ocpi {
        return 301 /ocpi/;
    }

    # 0. CPO Portal API & Portal UI (/cpo/api/ & /cpo/)
    location = /cpo/api/v1/events/stream {
        set $cpo_core "http://mapletyne-core:8000";
        rewrite ^/cpo/api/(.*)$ /api/$1 break;
        proxy_pass $cpo_core;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_x_forwarded_host;
        proxy_set_header X-Forwarded-Host $proxy_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_x_forwarded_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        include /etc/nginx/security-headers.conf;
    }

    location ^~ /cpo/api/ {
        set $cpo_core "http://mapletyne-core:8000";
        rewrite ^/cpo/api/(.*)$ /api/$1 break;
        proxy_pass $cpo_core;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_x_forwarded_host;
        proxy_set_header X-Forwarded-Host $proxy_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port $proxy_x_forwarded_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
