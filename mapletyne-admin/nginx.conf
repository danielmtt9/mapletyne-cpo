server {
    listen 8080;
    server_name _;

    # Security Headers (CIS & OWASP Standards)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://rsms.me; font-src 'self' https://fonts.gstatic.com https://rsms.me data:; connect-src 'self' ws: wss: https://payloadcms.mapletyne.com; img-src 'self' data: blob: https://payloadcms.mapletyne.com;" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 1. Custom Admin SPA (mapletyne-admin)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://rsms.me; font-src 'self' https://fonts.gstatic.com https://rsms.me data:; connect-src 'self' ws: wss: https://*.trycloudflare.com https://*.mapletyne.com https://payloadcms.mapletyne.com; img-src 'self' data: blob: https:;" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Static Assets Long-term Caching
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://rsms.me; font-src 'self' https://fonts.gstatic.com https://rsms.me data:; connect-src 'self' ws: wss: https://payloadcms.mapletyne.com; img-src 'self' data: blob: https://payloadcms.mapletyne.com;" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        access_log off;
    }

    # Manifest & Sitemap configurations
    location ~* \.(?:webmanifest|xml)$ {
        root /usr/share/nginx/html;
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://rsms.me; font-src 'self' https://fonts.gstatic.com https://rsms.me data:; connect-src 'self' ws: wss: https://payloadcms.mapletyne.com; img-src 'self' data: blob: https://payloadcms.mapletyne.com;" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        types {
            application/manifest+json webmanifest;
            application/xml xml;
        }
    }

    # 2. Mapletyne Core REST APIs
    location /api/v1/ {
        proxy_pass http://mapletyne-core:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Real-Time Server-Sent Events (SSE) Stream
    location /api/v1/events/stream {
        proxy_pass http://mapletyne-core:8000/api/v1/events/stream;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
    }

    # 4. Driver Charge App (PWA)
    location /app/ {
        proxy_pass http://mapletyne-chargeapp:8003/app/;
        proxy_set_header Host $host;
    }

    # 5. OCPP WebSockets
    location /ocpp16/ {
        proxy_pass http://mapletyne-core:9100/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /ocpp201/ {
        proxy_pass http://mapletyne-core:9201/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 6. Secure CMS Proxy for Puck Visual Editor (CWE-798 & CWE-200 Remediation)
    location /api/cms/ {
        limit_except GET POST PATCH OPTIONS {
            deny all;
        }

        # Require authenticated OpenCPO admin caller
        if ($http_authorization = "") {
            return 401 '{"error": "Unauthorized: OpenCPO admin authentication required"}';
        }

        rewrite ^/api/cms/(.*) /api/$1 break;
        proxy_pass https://payloadcms.mapletyne.com;
        proxy_ssl_server_name on;
        proxy_set_header Host payloadcms.mapletyne.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-side credential injection - hidden from client bundle and network traffic
        proxy_set_header Authorization "users API-Key ${PAYLOAD_API_KEY}";
    }
}
