server {
    listen 8080;
    server_name _;

    absolute_redirect off;

    # Docker embedded DNS resolver so NGINX starts cleanly even if upstreams are still booting
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Security Headers (CIS & OWASP Standards)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://rsms.me; font-src 'self' https://fonts.gstatic.com https://rsms.me data:; connect-src 'self' ws: wss:; img-src 'self' data: blob: https:;" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 0. Support direct /cpo/ subpath access on standalone port 8080/34000
    location = /cpo {
        return 301 /cpo/;
    }

    location = /cpo/api/v1/events/stream {
        set $core_api "http://mapletyne-core:8000";
        rewrite ^/cpo/api/v1/events/stream$ /api/v1/events/stream break;
        proxy_pass $core_api;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location ^~ /cpo/api/v1/ {
        set $core_api "http://mapletyne-core:8000";
        rewrite ^/cpo/api/v1/(.*)$ /api/v1/$1 break;
        proxy_pass $core_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /cpo/api/cms/ {
        default_type application/json;
        return 503 '{"error":"CMS endpoint not configured"}';
    }

    location ^~ /cpo/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://rsms.me; font-src 'self' https://fonts.gstatic.com https://rsms.me data:; connect-src 'self' ws: wss:; img-src 'self' data: blob: https:;" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        access_log off;
    }

    location = /cpo/site.webmanifest {
        alias /usr/share/nginx/html/site.webmanifest;
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://rsms.me; font-src 'self' https://fonts.gstatic.com https://rsms.me data:; connect-src 'self' ws: wss:; img-src 'self' data: blob: https:;" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        types {
            application/manifest+json webmanifest;
        }
    }

    location ^~ /cpo/ {
        rewrite ^/cpo/(.*)$ /$1 last;
    }

    # 1. Custom Admin SPA (mapletyne-admin)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://rsms.me; font-src 'self' https://fonts.gstatic.com https://rsms.me data:; connect-src 'self' ws: wss:; img-src 'self' data: blob: https:;" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Static Assets Long-term Caching
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://rsms.me; font-src 'self' https://fonts.gstatic.com https://rsms.me data:; connect-src 'self' ws: wss:; img-src 'self' data: blob: https:;" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        access_log off;
    }

    # Manifest & Sitemap configurations
    location ~* \.(?:webmanifest|xml)$ {
        root /usr/share/nginx/html;
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://rsms.me; font-src 'self' https://fonts.gstatic.com https://rsms.me data:; connect-src 'self' ws: wss:; img-src 'self' data: blob: https:;" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        types {
            application/manifest+json webmanifest;
            application/xml xml;
        }
    }

    # 2. Mapletyne Core REST APIs
    location = /api/v1/events/stream {
        set $core_api "http://mapletyne-core:8000";
        proxy_pass $core_api;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /api/v1/ {
        set $core_api "http://mapletyne-core:8000";
        proxy_pass $core_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Driver Charge App (PWA)
    location ^~ /app/ {
        set $chargeapp "http://mapletyne-chargeapp:8003";
        rewrite ^/app/(.*)$ /$1 break;
        proxy_pass $chargeapp;
        proxy_set_header Host $host;
    }

    # 5. OCPP WebSockets
    location /ocpp16/ {
        set $ocpp16 "http://mapletyne-core:9100";
        rewrite ^/ocpp16/(.*) /$1 break;
        proxy_pass $ocpp16;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /ocpp201/ {
        set $ocpp201 "http://mapletyne-core:9201";
        rewrite ^/ocpp201/(.*) /$1 break;
        proxy_pass $ocpp201;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 6. CMS Proxy endpoint (disabled unless configured externally)
    location /api/cms/ {
        default_type application/json;
        return 503 '{"error":"CMS endpoint not configured"}';
    }
}
