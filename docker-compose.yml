services:

  # ── Infrastructure ────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Core CSMS ─────────────────────────────────────────────────────────────

  mapletyne-core:
    build:
      context: ./mapletyne-core
      network: host
    container_name: mapletyne-core
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${OCPP_16_WS_PORT:-34100}:9100"   # OCPP 1.6 WebSocket (host port 34100)
      - "${OCPP_201_WS_PORT:-34201}:9201"  # OCPP 2.0.1 WebSocket (host port 34201)
      - "${OCPP_API_PORT:-34800}:8000"     # REST API (host port 34800)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Database
      PG_HOST: ${PG_HOST:-host.docker.internal}
      PG_PORT: 5432
      PG_NAME: ${POSTGRES_DB:-mapletyne_cpo}
      PG_USER: ${POSTGRES_USER:-cpo_admin}
      PG_PASSWORD: ${PG_PASSWORD:-CHANGE_ME_IN_PROD}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # App
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      MANAGEMENT_API_KEY: ${MANAGEMENT_API_KEY:-CHANGE_ME_IN_PROD}
      API_KEY: ${MANAGEMENT_API_KEY:-CHANGE_ME_IN_PROD}
      PUBLIC_URL: ${PUBLIC_URL:-https://admin.mapletyne.com}
      CORE_API_PUBLIC_URL: ${CORE_API_PUBLIC_URL:-https://api.mapletyne.com}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8080/auth}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-mapletyne}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://admin.mapletyne.com,https://app.mapletyne.com,*}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 7
      start_period: 45s
    volumes:
      - ./mapletyne-core:/app:rw
      - backup-data:/app/backups

  # ── Operator Dashboard ────────────────────────────────────────────────────

  mapletyne-admin:
    build:
      context: ./mapletyne-admin
    container_name: mapletyne-admin
    restart: unless-stopped
    ports:
      - "${CPO_ADMIN_PORT:-34000}:8080"  # Dashboard UI (host port 34000, container port 8080)
    environment:
      OCPP_CORE_API: http://mapletyne-core:8000
      CORE_API_KEY: ${MANAGEMENT_API_KEY:-CHANGE_ME_IN_PROD}
      JWT_SECRET: ${MANAGEMENT_API_KEY:-CHANGE_ME_IN_PROD}
      PUBLIC_URL: ${PUBLIC_URL:-https://admin.mapletyne.com}

  # ── Driver PWA ────────────────────────────────────────────────────────────

  mapletyne-chargeapp:
    build:
      context: ./mapletyne-chargeapp
      network: host
    container_name: mapletyne-chargeapp
    restart: unless-stopped
    depends_on:
      mapletyne-core:
        condition: service_healthy
    ports:
      - "${CHARGE_APP_PORT:-34003}:8003"  # Charge app (host port 34003)
    environment:
      OCPP_CORE_API: http://mapletyne-core:8000
      MANAGEMENT_API_KEY: ${MANAGEMENT_API_KEY:-CHANGE_ME_IN_PROD}
      CORE_API_KEY: ${MANAGEMENT_API_KEY:-CHANGE_ME_IN_PROD}
      PUBLIC_URL: ${CHARGE_APP_URL:-https://app.mapletyne.com}
      APP_TITLE: "Mapletyne Charge"
      SKIN: ${SKIN:-modern-emerald}
      PLUGINS: receipts,account,favorites,history
      DEFAULT_LANG: en
      JWT_SECRET: ${SECRET_KEY}
    volumes:
      - ./mapletyne-chargeapp:/app:rw
      - ./mapletyne-chargeapp/skins:/app/skins:rw

  # ── Compliance Tester ─────────────────────────────────────────────────────

  compliance-tester:
    build:
      context: ./opencpo-tester
      network: host
    restart: unless-stopped
    ports:
      - "${COMPLIANCE_PORT:-34090}:8090"  # Tester (host port 34090)
    environment:
      DEFAULT_WS_URL: ws://ocpp-core:9100

  # ── Virtual Charger Farm ──────────────────────────────────────────────────

  charger-farm:
    build:
      context: ./opencpo-charger-farm
      network: host
    restart: unless-stopped
    depends_on:
      ocpp-core:
        condition: service_healthy
    ports:
      - "${CHARGER_FARM_PORT:-34087}:8087"  # Simulator farm UI (host port 34087)
    environment:
      OCPP16_URL: ws://ocpp-core:9100
      OCPP201_URL: ws://ocpp-core:9201
      FARM_UI_PORT: 8087
    volumes:
      - ./opencpo-charger-farm:/app:rw

  # ── Identity & Access Management (Keycloak 26) ────────────────────────────

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    restart: unless-stopped
    command: ["start", "--import-realm"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://${PG_HOST:-host.docker.internal}:5432/keycloak"
      KC_DB_USERNAME: ${POSTGRES_USER:-ocpp}
      KC_DB_PASSWORD: ${PG_PASSWORD:-opencpo_db_pass_2026}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_RELATIVE_PATH: "/auth"
      KC_PROXY_HEADERS: "xforwarded"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "${KEYCLOAK_PORT:-34085}:8080"

  # ── Unified Reverse Proxy ─────────────────────────────────────────────────

  nginx:
    build:
      context: ./nginx
    restart: unless-stopped
    depends_on:
      - cpo-admin
      - ocpp-core
      - charge-app
      - charger-farm
      - compliance-tester
      - keycloak
    ports:
      - "${NGINX_PORT:-34080}:80"

volumes:
  backup-data:
    driver: local
