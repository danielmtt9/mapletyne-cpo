<!DOCTYPE html>
<html lang="{{ lang | default('en') }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="{{ (branding.bg_color if branding is defined and branding.bg_color else '#0B0F19') }}" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="{{ (branding.company_name if branding is defined and branding.company_name else 'MTT Charge') }}" />
  <link rel="manifest" href="/app/manifest.json?v=5" />
  <link rel="apple-touch-icon" href="{{ (branding.logo_data_uri if branding is defined and branding.logo_data_uri else '/app/static/icon-192.png?v=5') }}" />
  <link rel="apple-touch-icon" sizes="512x512" href="{{ (branding.logo_data_uri if branding is defined and branding.logo_data_uri else '/app/static/icon-512.png?v=5') }}" />
  <title>{% block title %}{{ (branding.company_name if branding is defined and branding.company_name else app_title) }}{% endblock %}</title>
  <meta name="csrf-token" content="{{ csrf_token | default('') }}" />
  <link rel="icon" href="{{ (branding.favicon_url or branding.logo_data_uri or '/skin/favicon.svg?v=5') if branding is defined else '/skin/favicon.svg?v=5' }}" type="image/svg+xml" />
  <link rel="stylesheet" href="/app/static/m3-tokens.css?v=5" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" />
  <link rel="stylesheet" href="/app/static/style.css?v=5" />
  <link rel="stylesheet" href="/app/skin/style.css?v=5" />
  <link rel="stylesheet" href="/app/static/leaflet.css?v=2" />
  <script src="/app/static/leaflet.js?v=2"></script>
  <script src="/app/static/htmx.min.js?v=2" defer></script>
  <script>
    // GAP-SEC-20: Auto-attach CSRF token to fetch and HTMX requests
    (function() {
      function getCsrfToken() {
        var meta = document.querySelector('meta[name="csrf-token"]');
        if (meta && meta.content && meta.content !== 'None') return meta.content;
        var m = document.cookie.match(/(?:^|;\s*)csrf_token=([^;]+)/);
        return m ? decodeURIComponent(m[1]) : '';
      }
      var origFetch = window.fetch;
      window.fetch = function(url, options) {
        options = options || {};
        var method = (options.method || 'GET').toUpperCase();
        if (['POST', 'PUT', 'DELETE', 'PATCH'].indexOf(method) !== -1) {
          var token = getCsrfToken();
          if (token) {
            if (options.headers instanceof Headers) {
              if (!options.headers.has('X-CSRF-Token')) {
                options.headers.set('X-CSRF-Token', token);
              }
            } else if (Array.isArray(options.headers)) {
              var hasHeader = options.headers.some(function(h) { return h[0].toLowerCase() === 'x-csrf-token'; });
              if (!hasHeader) options.headers.push(['X-CSRF-Token', token]);
            } else {
              options.headers = options.headers || {};
              if (!options.headers['X-CSRF-Token'] && !options.headers['x-csrf-token']) {
                options.headers['X-CSRF-Token'] = token;
              }
            }
          }
        }
        return origFetch.call(this, url, options);
      };
      document.addEventListener('htmx:configRequest', function(evt) {
        var token = getCsrfToken();
        if (token) {
          evt.detail.headers['X-CSRF-Token'] = token;
        }
      });
    })();
  </script>
  <script>window.FEATURES = {{ flags | tojson if flags is defined else '{}' }};</script>
  <script>window.BRANDING = {{ branding | tojson if branding is defined else '{}' }};</script>
  <style>
    :root {
      {% if branding is defined and branding %}
        {% if branding.primary_color %}--primary: {{ branding.primary_color }}; --accent: {{ branding.primary_color }};{% endif %}
        {% if branding.bg_color %}--bg: {{ branding.bg_color }}; --bg-deep: {{ branding.bg_color }};{% endif %}
        {% if branding.card_color %}--card: {{ branding.card_color }}; --card-bg: {{ branding.card_color }};{% endif %}
        {% if branding.secondary_color %}--bg2: {{ branding.secondary_color }};{% endif %}
        {% if branding.accent_color %}--electric-blue: {{ branding.accent_color }};{% endif %}
      {% endif %}
    }
    #app {
      padding-bottom: max(115px, calc(95px + env(safe-area-inset-bottom)));
      min-height: 100vh;
      box-sizing: border-box;
    }
  </style>
</head>
<body style="background:var(--bg,#0B0F19);color:var(--text,#f1f5f9);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display',system-ui,sans-serif;">
  <!-- PWA Install Banner -->
  <div id="pwa-install-banner" style="display:none;position:fixed;top:12px;right:12px;z-index:1200;background:rgba(23,35,53,0.85);border:1px solid var(--accent,#10B981);border-radius:20px;padding:6px 14px;box-shadow:0 8px 24px rgba(0,0,0,0.5);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);align-items:center;gap:8px;">
    <span class="material-symbols-outlined" style="font-size:18px;color:var(--text,#fff);">install_mobile</span>
    <span style="font-size:13px;font-weight:600;color:var(--text,#fff);">Install {{ (branding.company_name if branding is defined and branding.company_name else 'MTT Charge') }}</span>
    <button id="pwa-install-btn" style="background:var(--accent,#10B981);color:#0b1a10;border:none;border-radius:12px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;">Install</button>
    <button id="pwa-dismiss-btn" style="background:none;border:none;color:var(--text3,#64748b);font-size:14px;cursor:pointer;padding:0 2px;">✕</button>
  </div>

  <div id="app">
    {% block content %}{% endblock %}
  </div>

  <nav id="app-nav" style="position:fixed;bottom:0;left:0;right:0;z-index:1000;display:flex;align-items:center;justify-content:space-around;background:rgba(16,28,51,0.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid rgba(255,255,255,0.08);padding:10px 0 max(12px,env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,0.35);">
    <a href="/app/" id="nav-map" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:44px;min-width:64px;gap:3px;text-decoration:none;color:var(--text3,#64748b);padding:4px 16px;transition:color 0.2s;">
      <span class="material-symbols-outlined" style="font-size:24px;">map</span>
      <span style="font-size:12px;font-weight:500;">{{ t.tab_map | default('Map') }}</span>
    </a>
    <a href="/app/#scan" id="nav-scan" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:44px;min-width:64px;gap:3px;text-decoration:none;color:var(--text3,#64748b);padding:4px 16px;transition:color 0.2s;">
      <span class="material-symbols-outlined" style="font-size:24px;">qr_code_scanner</span>
      <span style="font-size:12px;font-weight:500;">{{ t.tab_scan | default('Scan') }}</span>
    </a>
    <a href="{% if account is defined and account %}/app/account/profile{% elif flags is defined and flags.get('account_login') %}/app/account/login{% else %}/app/account/settings{% endif %}" id="nav-account" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:44px;min-width:64px;gap:3px;text-decoration:none;color:var(--text3,#64748b);padding:4px 16px;transition:color 0.2s;">
      <span class="material-symbols-outlined" style="font-size:24px;">person</span>
      <span style="font-size:12px;font-weight:500;">{{ t.tab_account | default('Account') }}</span>
    </a>
  </nav>
  <script>(function(){var p=location.pathname,a='nav-map';if(p.indexOf('/account')!==-1)a='nav-account';var e=document.getElementById(a);if(e)e.style.color='var(--accent,#10B981)';})()</script>

  <script>
    // ── Service Worker Registration ──
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/app/sw.js', { scope: '/app/' })
          .then(function(reg) {
            console.log('PWA ServiceWorker registered with scope:', reg.scope);
          })
          .catch(function(err) {
            navigator.serviceWorker.register('/app/static/sw.js', { scope: '/app/' }).catch(function(){});
          });
      });
    }

    // ── PWA Install Prompt Listener ──
    var deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
      var banner = document.getElementById('pwa-install-banner');
      if (banner && !sessionStorage.getItem('pwa_dismissed')) {
        banner.style.display = 'flex';
      }
    });

    document.getElementById('pwa-install-btn')?.addEventListener('click', function() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function(choiceResult) {
          if (choiceResult.outcome === 'accepted') {
            document.getElementById('pwa-install-banner').style.display = 'none';
          }
          deferredPrompt = null;
        });
      }
    });

    document.getElementById('pwa-dismiss-btn')?.addEventListener('click', function() {
      document.getElementById('pwa-install-banner').style.display = 'none';
      sessionStorage.setItem('pwa_dismissed', '1');
    });
  </script>
</body>
</html>
