    # Clean 301 redirects for path prefixes without trailing slash
    location = /app {
        return 301 /app/;
    }

    location = /farm {
        return 301 /farm/;
    }

    location = /tester {
        return 301 /tester/;
    }

    location = /auth {
        return 301 /auth/;
    }

    location = /ocpi {
        return 301 /ocpi/;
