# Map WebSocket Upgrade headers
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── 1. Driver PWA App Subdomain (app.opencpo.mapletyne.com & *.app.opencpo.mapletyne.com) ──
server {
    listen 80;
    server_name app.opencpo.mapletyne.com *.app.opencpo.mapletyne.com;

    client_max_body_size 100M;

    location / {
        proxy_pass http://charge-app:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
    }
}

# ── 2. Core CSMS REST & WebSockets Subdomain (api.opencpo.mapletyne.com) ──
server {
    listen 80;
    server_name api.opencpo.mapletyne.com;

    client_max_body_size 100M;

    # OCPP 1.6-J WebSocket (ws://api.opencpo.mapletyne.com/ocpp16/<cp_id>)
    location /ocpp16/ {
        proxy_pass http://ocpp-core:9100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # OCPP 2.0.1 WebSocket (ws://api.opencpo.mapletyne.com/ocpp201/<cp_id>)
    location /ocpp201/ {
        proxy_pass http://ocpp-core:9201/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # CSMS REST API & OpenAPI Docs
    location / {
        proxy_pass http://ocpp-core:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
    }
}

