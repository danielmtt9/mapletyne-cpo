[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    baseline: tests verifying baseline environment and completed foundations
    tier1: Tier 1 Happy path core feature verification
    tier2: Tier 2 Boundary value analysis and negative invariant tests
    tier3: Tier 3 Pairwise interaction tests
    tier4: Tier 4 Real-world application workload scenarios
    m1: Milestone 1 Foundation & Shared Shells
    m2: Milestone 2 Driver Mobile PWA Core Charging Flow
    m3: Milestone 3 Driver Mobile PWA Account & Settings
    m4: Milestone 4 Operator Mission Control Dashboards
    m5: Milestone 5 Multi-Artboard Vector Export Pipeline
    m6: Milestone 6 Automated Quality Gate & Live Verification
